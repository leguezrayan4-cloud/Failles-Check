      - name: Installer Godot 4.7.2 et les modèles d'export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p download
          cd download
          rm -f godot.zip templates.tpz

          fetch() {
            # $1 = nom du fichier distant, $2 = nom local
            curl -fL --retry 5 --retry-delay 15 -o "$2" \
              "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$1" \
            || { echo "Direct échoué pour $1, essai avec GitHub CLI."; \
                 rm -f "$2"; \
                 gh release download 4.7.2-stable -R godotengine/godot -p "$1" -O "$2" --clobber; }
          }

          fetch "Godot_v4.7.2-stable_macos.universal.zip" godot.zip
          fetch "Godot_v4.7.2-stable_export_templates.tpz" templates.tpz

          unzip -q godot.zip -d "$HOME/godot"
          unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mv tpl/templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"
